name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lupa (Lua 5.1 for the validator)
        run: pip install lupa

      - name: Validator, test scenario and locale (enUS and frFR)
        run: python tools/check.py
